<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CFP Status Board</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Schibsted+Grotesk:wght@400;500;700&display=swap">
<style>
/* Layout: one column of bands. Decisions first, then the two headline numbers side by side, then build progress, method scoreboard, agents and spend. */
:root{
  --bg:#f2f5f7; --surface:#ffffff; --ink:#13202b; --ink2:#4a5b69; --line:#d9e1e7;
  --accent:#0b6e6e; --accent-bg:#e1f1f0;
  --good:#1d7a4c; --warn:#a96a0a; --bad:#b3261e; --mute:#8794a0;
  --good-bg:#e3f3ea; --warn-bg:#faf0dc; --bad-bg:#f9e4e2; --mute-bg:#e9eef2;
  --f-body:"Schibsted Grotesk",system-ui,sans-serif; --f-data:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f171e; --surface:#16212a; --ink:#e6edf2; --ink2:#9fb0be; --line:#26353f;
  --accent:#4fc3be; --accent-bg:#12353a;
  --good:#52c58a; --warn:#e0a443; --bad:#f08379; --mute:#7a8a97;
  --good-bg:#14301f; --warn-bg:#35280e; --bad-bg:#3a1a18; --mute-bg:#1f2c35; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f171e; --surface:#16212a; --ink:#e6edf2; --ink2:#9fb0be; --line:#26353f;
  --accent:#4fc3be; --accent-bg:#12353a;
  --good:#52c58a; --warn:#e0a443; --bad:#f08379; --mute:#7a8a97;
  --good-bg:#14301f; --warn-bg:#35280e; --bad-bg:#3a1a18; --mute-bg:#1f2c35; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:flex;flex-direction:column;gap:18px}
h1{font-size:26px;margin:0;letter-spacing:-.01em}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink2);margin:0 0 10px;font-weight:700}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 16px;align-items:baseline}
.sub{color:var(--ink2);font-size:13px}
.num{font-family:var(--f-data);font-variant-numeric:tabular-nums}
.band{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px}
.now{border-left:4px solid var(--accent);background:var(--accent-bg);border-radius:4px;padding:12px 14px}
.now b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin-bottom:2px}
.dec{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.dec li{padding:8px 10px;background:var(--surface);border:1px solid var(--line);border-radius:4px;min-width:0;overflow-wrap:anywhere}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:18px}
.big{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.big .n{font-family:var(--f-data);font-size:44px;font-weight:500;line-height:1}
.big .of{color:var(--ink2);font-size:14px}
.bar{display:flex;height:16px;border-radius:3px;overflow:hidden;margin:12px 0 10px;background:var(--mute-bg)}
.bar span{display:block;height:100%;min-width:2px}
.seg-good{background:var(--good)}.seg-warn{background:var(--warn)}.seg-bad{background:var(--bad)}.seg-mute{background:var(--mute)}
.leg{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:13px}
.leg li{display:grid;grid-template-columns:12px 1fr auto;gap:8px;align-items:center}
.sw{width:10px;height:10px;border-radius:2px}
.def{color:var(--ink2);font-size:12.5px;margin:10px 0 0}
.callout{margin-top:10px;padding:8px 10px;border-radius:4px;background:var(--bad-bg);color:var(--ink);font-size:13px}
.stages{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px}
.stage{border:1px solid var(--line);border-radius:5px;padding:10px 12px;min-width:0}
.stage h3{margin:0 0 6px;font-size:14px;display:flex;justify-content:space-between;gap:8px}
.stage ul{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:13px}
.stage li{display:grid;grid-template-columns:14px 1fr;gap:8px}
.box{width:11px;height:11px;border:2px solid var(--mute);border-radius:2px;margin-top:3px}
.box.done{background:var(--good);border-color:var(--good)}.box.doing{border-color:var(--warn);background:var(--warn-bg)}
.mini{display:flex;gap:2px;height:6px;margin-top:4px}.mini i{flex:1;background:var(--mute-bg);border-radius:1px}
.mini i.done{background:var(--good)}.mini i.doing{background:var(--warn)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:640px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink2);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11.5px;font-weight:500;white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)}.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.none{background:var(--mute-bg);color:var(--mute)}
.spend{display:flex;flex-direction:column;gap:8px;font-size:13px}
.srow{display:grid;grid-template-columns:1fr auto;gap:8px}
.meter{height:6px;background:var(--mute-bg);border-radius:3px;overflow:hidden;grid-column:1/-1}.meter i{display:block;height:100%;background:var(--accent)}
.agent{display:block;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}.ahead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.ahead .pill{flex:none;white-space:nowrap}.astat{margin:3px 0;color:var(--ink);overflow-wrap:anywhere}
.agent:last-child{border-bottom:0}.agent small{color:var(--ink2)}
.obj{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:14px 28px}
.obj>div{min-width:0}
.obj .left{font-size:12.5px;line-height:1.4}.obj .left ul{margin:4px 0 6px;padding-left:16px;display:flex;flex-direction:column;gap:3px}
@media (max-width:760px){.obj{grid-template-columns:minmax(0,1fr)}}
.obj p{margin:0 0 6px}.obj .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--accent);font-weight:700;display:block;margin-bottom:2px}
.good-tbl{width:100%;border-collapse:collapse;font-size:13px;margin-top:4px;table-layout:fixed}
.good-tbl td,.good-tbl th{overflow-wrap:anywhere}
.good-tbl th{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink2);text-align:left;padding:4px 8px}
.ladder{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0;padding:0;list-style:none}
.ladder li{font-size:12px;padding:3px 8px;border:1px solid var(--line);border-radius:3px;background:var(--mute-bg)}
.good-tbl td{padding:6px 8px;border-top:1px solid var(--line);vertical-align:top}.good-tbl td:first-child{font-weight:500}
/* 2026-10-02: the global table{min-width:640px} forced the half-width quality cards to overflow side by side */
.good-tbl{min-width:0}
.two>.band{min-width:0}
.q-tbl{min-width:0;table-layout:fixed;width:100%;font-size:12.5px}
.q-tbl th:nth-child(1){width:24%}.q-tbl th:nth-child(2){width:14%}.q-tbl th:nth-child(3){width:13%}
.q-tbl td,.q-tbl th{overflow-wrap:anywhere;word-break:break-word}
.q-tbl td:first-child{text-transform:capitalize}
.pill{max-width:100%}.q-tbl .pill{white-space:normal}
td small,td .pill{overflow-wrap:anywhere}
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px}
.step{border:1px solid var(--line);border-radius:5px;padding:12px;min-width:0;display:flex;flex-direction:column;gap:8px}
.step h3{margin:0;font-size:15px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.step .job{color:var(--ink2);font-size:12.5px;margin:0}
.step .letter{font-family:var(--f-data);color:var(--accent);margin-right:6px}
.it{display:grid;grid-template-columns:14px 1fr;gap:8px;font-size:13px;padding-top:8px;border-top:1px solid var(--line)}
.it .res{color:var(--ink2);font-size:12.5px;margin-top:1px}
.kind{display:inline-block;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;padding:0 6px;border-radius:3px;margin-right:6px;font-weight:700;vertical-align:1px}
.kind.experiment{background:var(--accent-bg);color:var(--accent)}.kind.fix{background:var(--warn-bg);color:var(--warn)}
.kind.build{background:var(--mute-bg);color:var(--ink2)}.kind.decision{background:var(--bad-bg);color:var(--bad)}
.arrow{color:var(--ink2);font-size:12px;margin:0 0 8px}
.chan{font-size:13px;display:flex;flex-direction:column;gap:6px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
button.theme{font:inherit;font-size:12px;color:var(--ink2);background:none;border:1px solid var(--line);border-radius:4px;padding:3px 9px;cursor:pointer}
button.theme:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
<div class="wrap" id="app"></div>
<script>
const D = /*DATA*/null;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct = (a, b) => b ? Math.round(100 * a / b) : 0;
function headline(h, big) {
  const total = h.levels.reduce((a, l) => a + l.n, 0);
  const first = h.levels[0];
  return `<section class="band"><h2>${esc(h.label)}</h2>
    <div class="big"><span class="n">${pct(first.n, total)}%</span><span class="of num">${first.n} of ${total} rows</span></div>
    <div class="bar" role="img" aria-label="${esc(h.label)} breakdown">${h.levels.map(l => `<span class="seg-${l.tone}" style="width:${100 * l.n / total}%"></span>`).join('')}</div>
    <ul class="leg">${h.levels.map(l => `<li><span class="sw seg-${l.tone}"></span><span>${esc(l.label)}</span><span class="num">${l.n}</span></li>`).join('')}</ul>
    ${h.open_rows != null ? `<div class="callout"><b class="num">${h.open_confirmed} of ${h.open_rows}</b> rows with a deadline still ahead are provable. ${esc(h.note)}</div>` : `<p class="def">${esc(h.note)}</p>`}
    <p class="def">${esc(h.definition)}</p></section>`;
}
function step(s) {
  const done = s.items.filter(i => i.s === 'done').length;
  return `<div class="step"><h3><span><span class="letter">${esc(s.id)}</span>${esc(s.name)}</span><span class="num">${done}/${s.items.length}</span></h3>
    <p class="job">${esc(s.job)}</p>
    ${s.items.map(i => `<div class="it"><span class="box ${i.s}"></span><div><span class="kind ${i.kind}">${esc(i.kind)}</span>${esc(i.t)}<div class="res">${i.s === 'done' ? 'Result: ' : ''}${esc(i.r)}</div></div></div>`).join('')}</div>`;
}
function objective(o) {
  return `<section class="band"><h2>Project objective</h2><div class="obj">
    <div class="left"><p><span class="lbl">What</span>${esc(o.what)}</p><p><span class="lbl">Why</span>${esc(o.why)}</p><ul>${o.why_points.map(x => `<li>${esc(x)}</li>`).join('')}</ul><p>${esc(o.why_close)}</p></div>
    <div><span class="lbl">What good looks like</span><table class="good-tbl"><thead><tr><th style="width:30%">Measure</th><th style="width:30%">Now</th><th>Target</th></tr></thead><tbody>${o.good.map(g => `<tr><td>${esc(g.label)}</td><td class="num">${esc(g.now)}</td><td>${esc(g.target)}</td></tr>`).join('')}</tbody></table>
    <p class="def">${esc(o.note)}</p>
    <span class="lbl" style="margin-top:12px">How we grade a field: four levels of proof</span><ol class="ladder">${o.ladder.map(x => `<li>${esc(x)}</li>`).join('')}</ol></div></div></section>`;
}
function qcard(q) {
  const rows = q.components.map(c => `<tr><td>${esc(c.key.replace('_', ' '))}</td><td class="num">${c.value}%</td><td class="num">${c.weight}</td><td>${esc(c.detail)}</td></tr>`).join('');
  const ex = q.excluded.map(e => `<li><b>${esc(e.key.replace('_', ' '))}</b> (weight ${e.weight}) <i>not scored</i>: ${esc(e.reason)}</li>`).join('');
  const partial = q.measured_weight < 100 ? `<div class="callout">Built from the components that have data: <b class="num">${q.measured_weight} of 100</b> points of weight. The rest are not scored, not scored as zero.</div>` : '';
  return `<section class="band"><h2>${esc(q.label)}</h2>
    <div class="big"><span class="n">${q.overall}%</span><span class="of num">range ${q.low}% to ${q.high}%; equal-weight ${q.equal_weight}%</span></div>
    ${partial}
    <table class="good-tbl q-tbl"><thead><tr><th>Component</th><th>Score</th><th>Weight</th><th>Measured how</th></tr></thead><tbody>${rows}</tbody></table>
    ${ex ? `<ul class="dec">${ex}</ul>` : ''}
    ${q.drivers.map(d => `<p class="def">Driver, not scored: ${esc(d)}</p>`).join('')}</section>`;
}
function splitCard(label, s) {
  if (!s) return '';
  const p = v => v === null || v === undefined ? 'n/a' : v + '%';
  return `<section class="band"><h2>${esc(label)}</h2>
    <p class="def" style="margin:0 0 6px"><b>Complete ${p(s.complete)}</b> &nbsp; <span class="num">${s.filled} of ${s.expected} expected fields filled (${p(s.fill_pct)}); coverage ${p(s.coverage_pct)}; ${s.excused_fields} call fields on ${s.excused_rows} far-future rows excused</span></p>
    <p class="def" style="margin:0"><b>Accurate ${p(s.accurate)}</b> &nbsp; <span class="num">${s.proven} proven, ${s.contradicted} contradicted; ${s.unproven} unproven (not counted wrong, ${p(s.unproven_share)} of stated facts), ${s.unproven_excused} excused</span></p></section>`;
}
function quality(Q) {
  if (!Q) return '';
  const sp = `<div class="two">${splitCard('Conferences: complete and accurate', Q.conference.split)}${splitCard('Awards: complete and accurate', Q.awards.split)}</div>
    <p class="def" style="margin:0 0 14px">${esc(Q.split_method || '')}</p>`;
  return sp + `<div class="two">${qcard(Q.conference)}${qcard(Q.awards)}</div>
    <p class="def" style="margin:0 0 14px">${esc(Q.method)} <b>Not measured:</b> ${esc(Q.not_measured)} <span class="num">as of ${esc(Q.as_of)}</span></p>`;
}
const ageDays = d => Math.round((Date.parse(D.as_of) - Date.parse(d)) / 86400000);
function nowBlock() {
  const w = (D.working_on || []).map(x => `<li><b>${esc(x.state)}.</b> ${esc(x.text)}</li>`).join('');
  const dec = D.decisions.map(d => { const a = d.added ? ageDays(d.added) : null; const stale = a === null || a > 2;
    return `<li><b style="display:inline;color:var(--warn);text-transform:none;letter-spacing:0;font-size:inherit">Waiting on you${a === null ? ' (undated)' : ` (${a === 0 ? 'today' : a + ' day' + (a > 1 ? 's' : '')})`}${stale ? ' - STALE?' : ''}.</b> ${esc(d.text)}${d.file ? ` <span class="sub num">${esc(d.file)}</span>` : ''}</li>`; }).join('');
  const warn = (D.warnings || []).map(x => `<li style="color:var(--bad)"><b>Board check:</b> ${esc(x)}</li>`).join('');
  return `<div class="now"><b>Working on</b>${esc(D.now)}<ul class="dec">${w}</ul><ul class="dec">${dec}</ul>${warn ? `<ul class="dec">${warn}</ul>` : ''}</div>`;
}
function verifiedBand(V) {
  if (!V || !V.length) return '';
  const rows = V.map(v => `<tr><td><b>${esc(v.event)}</b></td><td>${esc(v.what)}</td><td>${(v.links || []).map(u => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u.replace(/^https?:\/\/(www\.)?/, '').slice(0, 40))}</a>`).join('<br>')}</td><td class="num">${esc(v.on)}</td><td class="num">${esc(v.until)}</td></tr>`).join('');
  return `<section class="band"><h2>Verified by you &nbsp;<span class="num">${V.length} events</span></h2>
    <p class="def" style="margin:0 0 10px">Facts you checked on the event's own page. The weekly runs cannot override them and you are not asked about them again; a pin lapses on its date or when it is deleted. Source: docs/operations/pinned_rows.json.</p>
    <div class="tbl"><table><thead><tr><th>Event</th><th>What you verified</th><th>Pages</th><th>On</th><th>Holds until</th></tr></thead><tbody>${rows}</tbody></table></div></section>`;
}
function render() {
  const items = D.pipeline.flatMap(s => s.items);
  const done = items.filter(i => i.s === 'done').length;
  document.getElementById('app').innerHTML = `
    <div class="top"><div><h1>CFP Status Board</h1><div class="sub">${esc(D.scope)}</div></div>
      <div class="sub"><span class="num">as of ${esc(D.as_of)}</span> &nbsp; <button class="theme" id="tg" type="button">Theme</button></div></div>
    ${objective(D.objective)}
    ${nowBlock()}
    ${quality(D.quality)}
    <div class="two">${headline(D.headline.provable)}${headline(D.headline.customer)}</div>
    <section class="band"><h2>Build progress &nbsp;<span class="num">${done} of ${items.length} items done</span></h2>
      <p class="arrow">How the work connects: each step below is a stage of the production process. An <span class="kind experiment">experiment</span> asks one question about that step and records the answer; a <span class="kind fix">fix</span> corrects data; a <span class="kind build">build</span> makes a thing; a <span class="kind decision">decision</span> is open for you. A step is finished when its question is answered and the winner is wired in.</p>
      <div class="flow">${D.pipeline.map(step).join('')}</div>
      <p class="def">Counted by item, not by effort: the unfinished items include the largest piece (wiring in), so the count overstates how close we are.</p></section>
    <section class="band"><h2>Data quality by step</h2><div class="tbl"><table><thead><tr><th>Step</th><th>Measure</th><th>Result</th><th></th><th>Run</th></tr></thead><tbody>
      ${D.methods.map(m => `<tr><td><b>${esc(m.step)}</b><div class="sub">${esc(m.note)}</div></td><td>${esc(m.metric)}</td><td class="num">${esc(m.result)}</td><td><span class="pill ${m.verdict}">${({good:'good',warn:'partial',bad:'failed',none:'not run'})[m.verdict]}</span></td><td class="num">${esc(m.date)}</td></tr>`).join('')}
    </tbody></table></div></section>
    <div class="two"><section class="band"><h2>Agent tasks</h2>${D.agents.map(a => `<div class="agent"><div class="ahead"><b>${esc(a.name)}</b><span class="pill ${/^done/i.test(a.status) ? 'good' : 'none'}">${/^done/i.test(a.status) ? 'done' : 'not started'}</span></div><div class="astat">${esc(a.status.replace(/^done[ 0-9-]*:?\s*/i, ''))}</div><small>${esc(a.who)} &middot; <span class="num">${esc(a.budget)}</span></small></div>`).join('')}
      <div class="chan"><b>Agent channels</b>${D.channels.map(c => `<div><b>${esc(c.name)}</b> <span class="pill ${c.state === 'works' ? 'good' : 'none'}">${esc(c.state)}</span><div class="sub">${esc(c.how)}. ${esc(c.note)}</div></div>`).join('')}</div></section>
    <section class="band"><h2>Spend</h2><div class="spend">${D.spend.map(s => `<div class="srow"><span>${esc(s.label)}</span><span class="num">$${s.usd.toFixed(s.usd < 1 ? 3 : 2)}${s.cap ? ' of $' + s.cap.toFixed(2) : ''}</span>${s.cap ? `<div class="meter"><i style="width:${100 * s.usd / s.cap}%"></i></div>` : ''}</div>`).join('')}</div></section></div>
    ${verifiedBand(D.verified)}`;
  document.getElementById('tg').onclick = () => {
    const r = document.documentElement, dark = r.getAttribute('data-theme') === 'dark' || (!r.getAttribute('data-theme') && matchMedia('(prefers-color-scheme:dark)').matches);
    r.setAttribute('data-theme', dark ? 'light' : 'dark');
  };
}
render();
</script>
