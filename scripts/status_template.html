<title>CFP Status Board</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Schibsted+Grotesk:wght@400;500;700&display=swap">
<style>
/* Layout: one column of bands. Decisions first, then the two headline numbers side by side, then build progress, method scoreboard, agents and spend. */
:root{
  --bg:#f2f5f7; --surface:#ffffff; --ink:#13202b; --ink2:#4a5b69; --line:#d9e1e7;
  --accent:#0b6e6e; --accent-bg:#e1f1f0;
  --good:#1d7a4c; --warn:#a96a0a; --bad:#b3261e; --mute:#8794a0;
  --good-bg:#e3f3ea; --warn-bg:#faf0dc; --bad-bg:#f9e4e2; --mute-bg:#e9eef2;
  --f-body:"Schibsted Grotesk",system-ui,sans-serif; --f-data:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f171e; --surface:#16212a; --ink:#e6edf2; --ink2:#9fb0be; --line:#26353f;
  --accent:#4fc3be; --accent-bg:#12353a;
  --good:#52c58a; --warn:#e0a443; --bad:#f08379; --mute:#7a8a97;
  --good-bg:#14301f; --warn-bg:#35280e; --bad-bg:#3a1a18; --mute-bg:#1f2c35; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f171e; --surface:#16212a; --ink:#e6edf2; --ink2:#9fb0be; --line:#26353f;
  --accent:#4fc3be; --accent-bg:#12353a;
  --good:#52c58a; --warn:#e0a443; --bad:#f08379; --mute:#7a8a97;
  --good-bg:#14301f; --warn-bg:#35280e; --bad-bg:#3a1a18; --mute-bg:#1f2c35; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:flex;flex-direction:column;gap:18px}
h1{font-size:26px;margin:0;letter-spacing:-.01em}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink2);margin:0 0 10px;font-weight:700}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 16px;align-items:baseline}
.sub{color:var(--ink2);font-size:13px}
.num{font-family:var(--f-data);font-variant-numeric:tabular-nums}
.band{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px}
.now{border-left:4px solid var(--accent);background:var(--accent-bg);border-radius:4px;padding:12px 14px}
.now b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin-bottom:2px}
.dec{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.dec li{padding:8px 10px;background:var(--surface);border:1px solid var(--line);border-radius:4px;min-width:0;overflow-wrap:anywhere}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:18px}
.big{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.big .n{font-family:var(--f-data);font-size:44px;font-weight:500;line-height:1}
.big .of{color:var(--ink2);font-size:14px}
.bar{display:flex;height:16px;border-radius:3px;overflow:hidden;margin:12px 0 10px;background:var(--mute-bg)}
.bar span{display:block;height:100%;min-width:2px}
.seg-good{background:var(--good)}.seg-warn{background:var(--warn)}.seg-bad{background:var(--bad)}.seg-mute{background:var(--mute)}
.leg{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:13px}
.leg li{display:grid;grid-template-columns:12px 1fr auto;gap:8px;align-items:center}
.sw{width:10px;height:10px;border-radius:2px}
.def{color:var(--ink2);font-size:12.5px;margin:10px 0 0}
.callout{margin-top:10px;padding:8px 10px;border-radius:4px;background:var(--bad-bg);color:var(--ink);font-size:13px}
.stages{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px}
.stage{border:1px solid var(--line);border-radius:5px;padding:10px 12px;min-width:0}
.stage h3{margin:0 0 6px;font-size:14px;display:flex;justify-content:space-between;gap:8px}
.stage ul{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:13px}
.stage li{display:grid;grid-template-columns:14px 1fr;gap:8px}
.box{width:11px;height:11px;border:2px solid var(--mute);border-radius:2px;margin-top:3px}
.box.done{background:var(--good);border-color:var(--good)}.box.doing{border-color:var(--warn);background:var(--warn-bg)}
.mini{display:flex;gap:2px;height:6px;margin-top:4px}.mini i{flex:1;background:var(--mute-bg);border-radius:1px}
.mini i.done{background:var(--good)}.mini i.doing{background:var(--warn)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:640px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink2);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11.5px;font-weight:500;white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)}.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.none{background:var(--mute-bg);color:var(--mute)}
.spend{display:flex;flex-direction:column;gap:8px;font-size:13px}
.srow{display:grid;grid-template-columns:1fr auto;gap:8px}
.meter{height:6px;background:var(--mute-bg);border-radius:3px;overflow:hidden;grid-column:1/-1}.meter i{display:block;height:100%;background:var(--accent)}
.agent{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.agent:last-child{border-bottom:0}.agent small{color:var(--ink2)}
button.theme{font:inherit;font-size:12px;color:var(--ink2);background:none;border:1px solid var(--line);border-radius:4px;padding:3px 9px;cursor:pointer}
button.theme:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
<div class="wrap" id="app"></div>
<script>
const D = /*DATA*/null;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct = (a, b) => b ? Math.round(100 * a / b) : 0;
function headline(h, big) {
  const total = h.levels.reduce((a, l) => a + l.n, 0);
  const first = h.levels[0];
  return `<section class="band"><h2>${esc(h.label)}</h2>
    <div class="big"><span class="n">${pct(first.n, total)}%</span><span class="of num">${first.n} of ${total} rows</span></div>
    <div class="bar" role="img" aria-label="${esc(h.label)} breakdown">${h.levels.map(l => `<span class="seg-${l.tone}" style="width:${100 * l.n / total}%"></span>`).join('')}</div>
    <ul class="leg">${h.levels.map(l => `<li><span class="sw seg-${l.tone}"></span><span>${esc(l.label)}</span><span class="num">${l.n}</span></li>`).join('')}</ul>
    ${h.open_rows != null ? `<div class="callout"><b class="num">${h.open_confirmed} of ${h.open_rows}</b> rows with a deadline still ahead are provable. ${esc(h.note)}</div>` : `<p class="def">${esc(h.note)}</p>`}
    <p class="def">${esc(h.definition)}</p></section>`;
}
function stage(s) {
  const done = s.items.filter(i => i.s === 'done').length;
  return `<div class="stage"><h3><span>${esc(s.name)}</span><span class="num">${done}/${s.items.length}</span></h3>
    <div class="mini">${s.items.map(i => `<i class="${i.s}"></i>`).join('')}</div>
    <ul>${s.items.map(i => `<li><span class="box ${i.s}"></span><span>${esc(i.t)}</span></li>`).join('')}</ul></div>`;
}
function render() {
  const items = D.stages.flatMap(s => s.items);
  const done = items.filter(i => i.s === 'done').length;
  document.getElementById('app').innerHTML = `
    <div class="top"><div><h1>CFP Status Board</h1><div class="sub">${esc(D.scope)}</div></div>
      <div class="sub"><span class="num">as of ${esc(D.as_of)}</span> &nbsp; <button class="theme" id="tg" type="button">Theme</button></div></div>
    <div class="now"><b>Working on</b>${esc(D.now)}
      <ul class="dec">${D.decisions.map(d => `<li><b style="display:inline;color:var(--warn);text-transform:none;letter-spacing:0;font-size:inherit">Waiting on you.</b> ${esc(d.text)}${d.file ? ` <span class="sub num">${esc(d.file)}</span>` : ''}</li>`).join('')}</ul></div>
    <div class="two">${headline(D.headline.provable)}${headline(D.headline.customer)}</div>
    <section class="band"><h2>Build progress &nbsp;<span class="num">${done} of ${items.length} items done</span></h2><div class="stages">${D.stages.map(stage).join('')}</div>
      <p class="def">Counted by item, not by effort: the unfinished items include the largest piece (wiring it in), so the item count overstates how close we are.</p></section>
    <section class="band"><h2>Data quality by step</h2><div class="tbl"><table><thead><tr><th>Step</th><th>Measure</th><th>Result</th><th></th><th>Run</th></tr></thead><tbody>
      ${D.methods.map(m => `<tr><td><b>${esc(m.step)}</b><div class="sub">${esc(m.note)}</div></td><td>${esc(m.metric)}</td><td class="num">${esc(m.result)}</td><td><span class="pill ${m.verdict}">${({good:'good',warn:'partial',bad:'failed',none:'not run'})[m.verdict]}</span></td><td class="num">${esc(m.date)}</td></tr>`).join('')}
    </tbody></table></div></section>
    <div class="two"><section class="band"><h2>Agent tasks</h2>${D.agents.map(a => `<div class="agent"><span><b>${esc(a.name)}</b></span><span class="pill none">${esc(a.status)}</span><small>${esc(a.who)}</small><small class="num">${esc(a.budget)}</small></div>`).join('')}</section>
    <section class="band"><h2>Spend</h2><div class="spend">${D.spend.map(s => `<div class="srow"><span>${esc(s.label)}</span><span class="num">$${s.usd.toFixed(s.usd < 1 ? 3 : 2)}${s.cap ? ' of $' + s.cap.toFixed(2) : ''}</span>${s.cap ? `<div class="meter"><i style="width:${100 * s.usd / s.cap}%"></i></div>` : ''}</div>`).join('')}</div></section></div>`;
  document.getElementById('tg').onclick = () => {
    const r = document.documentElement, dark = r.getAttribute('data-theme') === 'dark' || (!r.getAttribute('data-theme') && matchMedia('(prefers-color-scheme:dark)').matches);
    r.setAttribute('data-theme', dark ? 'light' : 'dark');
  };
}
render();
</script>
