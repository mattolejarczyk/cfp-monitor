<style>
/* Layout: a working list. Summary and the "Needs you" strip first, then waves; each action is one expandable row. Colour carries state, never decoration. */
:root{--bg:#f4f6f5;--surface:#ffffff;--ink:#1c2523;--muted:#5a6663;--line:#dce2df;--accent:#0f6b66;--accent-bg:#e2f1ef;
--s-todo:#6b7673;--s-todo-bg:#e8ecea;--s-building:#2457a6;--s-building-bg:#e3ecf9;--s-review:#7a4fb0;--s-review-bg:#eee6f8;--s-verified:#1f7a46;--s-verified-bg:#e0f3e8;
--s-waiting:#8a6100;--s-waiting-bg:#f8efd3;--s-needs:#b3261e;--s-needs-bg:#fbe4e1;--s-cond:#5b6f8a;--s-cond-bg:#e6ebf2;
--font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121816;--surface:#1a2220;--ink:#e6ecea;--muted:#9aa7a3;--line:#2c3835;--accent:#4fc2b9;--accent-bg:#17302d;
--s-todo:#9aa7a3;--s-todo-bg:#27302d;--s-building:#7fb0f5;--s-building-bg:#18273d;--s-review:#bf9cf0;--s-review-bg:#2a2038;--s-verified:#67d391;--s-verified-bg:#173025;
--s-waiting:#e2b94d;--s-waiting-bg:#352c12;--s-needs:#ff8a80;--s-needs-bg:#3a1a17;--s-cond:#9db3d1;--s-cond-bg:#222c3a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121816;--surface:#1a2220;--ink:#e6ecea;--muted:#9aa7a3;--line:#2c3835;--accent:#4fc2b9;--accent-bg:#17302d;
--s-todo:#9aa7a3;--s-todo-bg:#27302d;--s-building:#7fb0f5;--s-building-bg:#18273d;--s-review:#bf9cf0;--s-review-bg:#2a2038;--s-verified:#67d391;--s-verified-bg:#173025;
--s-waiting:#e2b94d;--s-waiting-bg:#352c12;--s-needs:#ff8a80;--s-needs-bg:#3a1a17;--s-cond:#9db3d1;--s-cond-bg:#222c3a;color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;padding-inline:16px;padding-block:20px 48px}
#app{max-width:1080px;margin:0 auto}
h1{font-size:26px;font-weight:600;margin:0;text-wrap:balance}
h2{font-size:17px;font-weight:600;margin:0;text-wrap:balance}
.top{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
.sub{color:var(--muted);font-size:12.5px}.intro{max-width:68ch;color:var(--muted);margin:6px 0 0}
button,select,input{font:inherit;color:var(--ink)}
.theme{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-top:14px}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--s-todo-bg);margin:10px 0 8px}
.bar i{display:block;height:100%}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:500;cursor:pointer;background:var(--s-todo-bg);color:var(--s-todo)}
.chip b{font-family:var(--mono);font-weight:500}
.chip[aria-pressed="true"]{outline:2px solid var(--accent)}
.st-building{background:var(--s-building-bg);color:var(--s-building)}.st-review{background:var(--s-review-bg);color:var(--s-review)}.st-verified{background:var(--s-verified-bg);color:var(--s-verified)}
.st-waiting{background:var(--s-waiting-bg);color:var(--s-waiting)}.st-needs-you{background:var(--s-needs-bg);color:var(--s-needs)}.st-conditional{background:var(--s-cond-bg);color:var(--s-cond)}.st-todo{background:var(--s-todo-bg);color:var(--s-todo)}
.fill-todo{background:var(--s-todo)}.fill-building{background:var(--s-building)}.fill-review{background:var(--s-review)}.fill-verified{background:var(--s-verified)}.fill-waiting{background:var(--s-waiting)}.fill-needs-you{background:var(--s-needs)}.fill-conditional{background:var(--s-cond)}
.needs{border-color:var(--s-needs);background:var(--surface)}
.needs h2{color:var(--s-needs)}
.needs ul,.next ul{margin:8px 0 0;padding-left:18px}.needs li,.next li{margin:4px 0}
.fp{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:8px}
.fp div{border-radius:6px;padding:8px 10px;background:var(--s-todo-bg)}.fp b{display:block;font-family:var(--mono);font-size:20px;font-weight:500}
.fp .OVERCOME{background:var(--s-verified-bg);color:var(--s-verified)}.fp .MITIGATED{background:var(--s-building-bg);color:var(--s-building)}.fp .WATCH{background:var(--s-waiting-bg);color:var(--s-waiting)}.fp .PENDING{background:var(--s-needs-bg);color:var(--s-needs)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px}
.filters select,.filters input{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5px 8px;min-width:0}
.filters input{flex:1 1 180px}
.wave{margin-top:22px}.wave-head{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;justify-content:space-between}
.wave .goal{color:var(--muted);font-size:13px;margin:2px 0 0;max-width:80ch}
.prog{font-family:var(--mono);font-size:12px;color:var(--muted)}
.act{background:var(--surface);border:1px solid var(--line);border-radius:8px;margin-top:8px}
.act summary{list-style:none;cursor:pointer;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;padding:10px 12px}
.act summary::-webkit-details-marker{display:none}
.act summary:focus-visible,.chip:focus-visible,.theme:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.act[open] summary{border-bottom:1px solid var(--line)}
.aid{font-family:var(--mono);font-size:12px;color:var(--muted)}
.atitle{flex:1 1 280px;min-width:0;font-weight:500}
.badge{font-size:11.5px;border:1px solid var(--line);border-radius:4px;padding:0 6px;color:var(--muted);white-space:nowrap}
.cost{font-family:var(--mono);font-size:12px;color:var(--muted)}
.body{padding:10px 14px 14px;display:grid;gap:8px;min-width:0}
.body p{margin:0;max-width:78ch}.lbl{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:block}
.ask{color:var(--s-needs);font-weight:500}
.tags{display:flex;flex-wrap:wrap;gap:6px}.tag{font-family:var(--mono);font-size:12px;border-radius:4px;padding:0 6px;background:var(--s-todo-bg);color:var(--s-todo)}
.tag.OVERCOME{background:var(--s-verified-bg);color:var(--s-verified)}.tag.MITIGATED{background:var(--s-building-bg);color:var(--s-building)}.tag.WATCH{background:var(--s-waiting-bg);color:var(--s-waiting)}.tag.PENDING{background:var(--s-needs-bg);color:var(--s-needs)}
.ev{margin:0;padding-left:18px;font-family:var(--mono);font-size:12px;overflow-wrap:anywhere}
.empty{color:var(--muted);padding:12px 0}
@media (max-width:560px){.fp{grid-template-columns:repeat(2,minmax(0,1fr))}h1{font-size:22px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const D={"as_of": "2026-10-05", "title": "CFP Control List", "intro": "The work list behind the failure-point register. Each action closes one or more root-cause failure points; when an action is verified, the register updates itself. A builder agent does the work in an isolated branch, the reviewer verifies it, and only the items marked Needs you wait for you.", "waves": [{"id": "W0", "name": "Triage and setup", "goal": "Handle upstream's reply to note 26 and stand up this list."}, {"id": "W1", "name": "Code-only hardening", "goal": "Close the failure points that need code and tests only. No cost, no change to Friday's or Saturday's job behaviour."}, {"id": "W2", "name": "Measurement foundation", "goal": "Measure what is unmeasured (non-deadline facts, awards) and grow the answer key. About 30 cents in cheap-model calls."}, {"id": "W3", "name": "Live evidence", "goal": "Read the first live runs of the new job steps and decide from evidence. Tied to the calendar."}, {"id": "W4", "name": "Upstream batch", "goal": "Everything that only upstream can close, drafted for you to send."}], "owners": {"builder": "Builder agent", "me": "Reviewer (Claude)", "you": "You", "upstream": "Upstream", "job": "Scheduled job"}, "actions": [{"id": "ACT-01", "wave": "W0", "step": "D", "owner": "you", "state": "verified", "cost": "$0", "title": "Send note 27 to upstream", "detail": "Upstream's reply to note 26 did not apply: 12 of 13 conference ids and 4 of 7 award ids are not ours, two replacement pages and one quote do not check out, and two sections are prose. Note 27 lists the ids we hold and the identity questions.", "needs_you": "", "closes": ["D1", "A11"], "acceptance": "Note sent; upstream's reply received.", "depends": [], "evidence": ["experiments/purpose_audit/NOTE-TO-UPSTREAM-27.md", "Sent by the operator; upstream replied 2026-10-05: 4 live rows and 6 of 7 awards now keyed on our ids, identity map usable; three claims rejected on page evidence (see note 28)"], "updated": "2026-10-05", "on_verify": {}}, {"id": "ACT-02", "wave": "W0", "step": "D", "owner": "me", "state": "verified", "cost": "$0", "title": "Triage upstream's corrected patch and apply the identity decisions", "detail": "Upstream's 10-05 replies (notes 26 to 28): all 20 rows of the corrected sparse patch are keyed on ids we hold; the two city claims were withdrawn (our pages-checked Kolkata and Singapore stand); unverified evidence cleared to blanks. APPLIED: nine input rows stamped with the confirmed ids, one OWASP row stamped with its survivor id, one marked DUP_OF. The patch's STATUS and link columns cannot travel in a sparse patch, so they arrive through the research; the citation withdrawals and the duplicate retirements are ACT-46 and ACT-47.", "needs_you": "", "closes": ["D1", "D10"], "acceptance": "Identity decisions applied to the live input lists with backups and logged; every researched row has a permanent id; the rest of the patch routed to named actions.", "depends": ["ACT-45"], "evidence": ["10-05: identity map applied: experiments/purpose_audit/identity_map_20261005.py (9 input rows stamped; unresolved ids 11 -> 2); logged in OPERATOR-EDITS-LOG.md", "10-05 later: dup_of_20261005.py (1 DUP_OF, 1 stamp; backup); unresolved ids 11 -> 1; 20 of 20 patch ids ours (checked)", "Reviewed 10-05: 20 of 20 patch ids ours; identity decisions applied live (9 stamps, 1 stamp, 1 DUP_OF) with backups; unresolved ids 11 -> 1; remainder routed to ACT-46/47"], "updated": "2026-10-05", "on_verify": {"D10": {"remains": "Closed once upstream's corrected patch is loaded; watch for the next passed-deadline-Open row."}}}, {"id": "ACT-03", "wave": "W0", "step": "F", "owner": "me", "state": "verified", "cost": "$0", "title": "Control list, builder brief and the first builder wave", "detail": "Action data, generator and page; the builder brief with the autonomy tiers and caps; the builder started on Wave 1 in an isolated branch.", "needs_you": "", "closes": ["F5"], "acceptance": "Page renders; tests pass; builder running.", "depends": [], "evidence": ["scripts/control_list.py", "tests/test_control_list.py", "docs/control/BUILDER-BRIEF.md"], "updated": "2026-10-05", "on_verify": {}}, {"id": "ACT-04", "wave": "W0", "step": "F", "owner": "you", "state": "verified", "cost": "$0", "title": "Decision: a fact that a page proves and that agrees with our value counts as confirmed for scoring the grounded call, never for scoring the reader", "detail": "Decided by you on 2026-10-05. It avoids a circular score: the reader is never graded against facts it helped confirm. Implemented in ACT-21.", "needs_you": "", "closes": ["F4"], "acceptance": "Recorded.", "depends": [], "evidence": ["Operator decision, 2026-10-05"], "updated": "2026-10-05", "on_verify": {}}, {"id": "ACT-10", "wave": "W1", "step": "D", "owner": "builder", "state": "building", "cost": "Code only", "title": "Rows loaded by hand are added to the approved file at load time", "detail": "A database row that is missing from the approved file gets no evidence carry the first Saturday (this is how three verified deadlines lost evidence on 10-03). The load should add such rows to the approved file by itself, with a backup and a line in the report.", "needs_you": "", "closes": ["D6"], "acceptance": "Sandbox rehearsal: a hand-loaded row absent from the approved file keeps its evidence through a load; tests; QA register updated.", "depends": [], "evidence": [], "updated": "2026-10-05", "on_verify": {"D6": {"status": "OVERCOME", "remains": "None known."}}}, {"id": "ACT-11", "wave": "W1", "step": "D", "owner": "builder", "state": "building", "cost": "Code only", "title": "Pins for awards", "detail": "The pins ledger skips awards. Extend it so a fact verified once on an award's own page is entered once, applied before the gate and shown on the board. Needed for the held Global Energy Show awards row and the status corrections.", "needs_you": "", "closes": ["A5"], "acceptance": "A pinned award fact survives a sandbox awards load; tests; board panel lists it.", "depends": [], "evidence": [], "updated": "2026-10-05", "on_verify": {"A5": {"remains": "A pin holds one edition; the next edition is a new row. A ruling only protects once it is entered."}}}, {"id": "ACT-12", "wave": "W1", "step": "B", "owner": "builder", "state": "building", "cost": "Code only", "title": "Verifier falls back to the real-Chrome render for walled pages", "detail": "Pages that answer HTTP 403 read as unconfirmed in the weekly verifier. The reader already has a render fallback; use it in the verifier too.", "needs_you": "", "closes": ["B2"], "acceptance": "A saved walled-page fixture verifies through the render path; tests; no change for pages the plain fetch reads.", "depends": [], "evidence": [], "updated": "2026-10-05", "on_verify": {"B2": {"status": "OVERCOME", "remains": "Hard anti-bot hosts are skipped by design."}}}, {"id": "ACT-13", "wave": "W1", "step": "C", "owner": "builder", "state": "building", "cost": "Code only", "title": "Arbiter picks the earliest of two deadlines on one page (trap case T04)", "detail": "Two tracks, two deadlines on one page: the arbiter should default to the earliest open round and record the other.", "needs_you": "", "closes": ["C5"], "acceptance": "Trap case T04 changes from GAP to PASS; tests.", "depends": [], "evidence": [], "updated": "2026-10-05", "on_verify": {"C5": {"status": "OVERCOME", "remains": "None known."}}}, {"id": "ACT-14", "wave": "W1", "step": "B", "owner": "builder", "state": "building", "cost": "Code only", "title": "Flag an aggregator cited as evidence for an event it does not list (trap case T05)", "detail": "A third-party page cited in place of the organizer's should be flagged by the gate or the load QA.", "needs_you": "", "closes": ["B6"], "acceptance": "Trap case T05 changes from GAP to PASS; tests; the flag appears in the load report.", "depends": [], "evidence": [], "updated": "2026-10-05", "on_verify": {"B6": {"status": "MITIGATED", "remains": "Detected and flagged; the replacement page still has to come from upstream."}}}, {"id": "ACT-15", "wave": "W1", "step": "B", "owner": "builder", "state": "building", "cost": "Code only", "title": "Arbiter reads a header date with no 'held' word beside it (trap case T02)", "detail": "A header prints dates bare ('Boston, MA | May 10-12th, 2027') and the arbiter wants a 'takes place' word. Teach it the header pattern with the year check intact.", "needs_you": "", "closes": ["B4"], "acceptance": "Trap case T02 changes from GAP to PASS; no false accepts on the other trap cases.", "depends": [], "evidence": [], "updated": "2026-10-05", "on_verify": {"B4": {"remains": "Pages with no year beside the date stay blank (safe, but a lost answer)."}}}, {"id": "ACT-16", "wave": "W1", "step": "A", "owner": "builder", "state": "building", "cost": "Code only", "title": "Every delivery and sparse patch is checked for unknown ids automatically, with a table of the ids we hold", "detail": "Run the delivery id check as part of acceptance, refuse a patch keyed on ids we do not hold, and print the table that note 27 needed by hand (their id, the id we hold, the city we hold).", "needs_you": "", "closes": ["A11", "D1"], "acceptance": "Note 26's reply produces the note 27 table by command; tests; wired into the accept step.", "depends": [], "evidence": [], "updated": "2026-10-05", "on_verify": {"A11": {"status": "OVERCOME", "remains": "None known."}, "D1": {"remains": "About 11 rows a week still cannot load fresh until upstream returns the stamped ids; our side now triages replies by command."}}}, {"id": "ACT-17", "wave": "W1", "step": "D", "owner": "builder", "state": "building", "cost": "Code only", "title": "Carried values keep their age, and the load QA flags an old carried value", "detail": "Carry rules keep last week's organizer, evidence and sponsorship. Record when each was last confirmed and flag any carried more than a set number of weeks.", "needs_you": "", "closes": ["D8"], "acceptance": "A carried value older than the limit appears in the load report; tests; limit stated in the QA register.", "depends": [], "evidence": [], "updated": "2026-10-05", "on_verify": {"D8": {"status": "MITIGATED", "remains": "Flagged when older than the limit; nobody re-verifies it automatically."}}}, {"id": "ACT-18", "wave": "W1", "step": "C", "owner": "builder", "state": "building", "cost": "Code only", "title": "Separate 'date confirmed' from 'call status confirmed' in the stored verification label (design and sandbox migration)", "detail": "A 'verified' label can mean the call was seen open, not that the date was found. Add a basis to the label. The builder designs it and proves it on a sandbox copy; the reviewer applies it to the live database with a backup.", "needs_you": "", "closes": ["C6"], "acceptance": "Sandbox migration passes invariants and the board figures do not change; tests; the reviewer applies it live.", "depends": [], "evidence": [], "updated": "2026-10-05", "on_verify": {"C6": {"status": "OVERCOME", "remains": "None known."}}}, {"id": "ACT-19", "wave": "W1", "step": "A", "owner": "builder", "state": "building", "cost": "Code only", "title": "Automatic tests for renamed, closed and successor events (trap cases T06 to T08)", "detail": "Make the parts of the human trap cases that code can judge into offline tests: two names of one event are not called dead; one brand with two events keeps two rows; a dead domain returns blanks.", "needs_you": "", "closes": ["A15"], "acceptance": "T06 to T08 have an automatic check where code can judge it; the rest are listed as needing a person.", "depends": [], "evidence": [], "updated": "2026-10-05", "on_verify": {"A15": {"status": "MITIGATED", "remains": "The cases a person must judge are listed; no data-driven test of a live rename."}}}, {"id": "ACT-20", "wave": "W2", "step": "D", "owner": "builder", "state": "todo", "cost": "About 2 to 5 cents a week", "title": "Weekly shadow reader for city, venue, const STATES=[["needs-you","Needs you"],["building","Building"],["review","In review"],["waiting","Waiting"],["conditional","Conditional"],["todo","To do"],["verified","Verified"]];

const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function save(){try{localStorage.setItem('cfp-control-filters',JSON.stringify(F));}catch(e){}}
const vis=a=>(!F.wave||a.wave===F.wave)&&(!F.step||a.step===F.step)&&(!F.owner||a.owner===F.owner)&&(!F.state||a.state===F.state)&&(!F.q||(a.id+' '+a.title+' '+a.detail+' '+(a.closes||[]).join(' ')).toLowerCase().includes(F.q.toLowerCase()));
